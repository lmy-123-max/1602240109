<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牙科连锁 · 门店/总部运营管理</title>
<style>
:root{
  --brand:#d97a1f; --brand-d:#b35e0d; --brand-l:#e89044; --brand-bg:#fdf3e5;
  --ink:#1b2320; --muted:#7c8a86; --line:#e6e6e0; --bg:#f7f6f2;
  --warn:#d9822b; --danger:#d9534f; --blue:#2b7cd3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:230px;background:linear-gradient(185deg,var(--brand) 0%,var(--brand-d) 100%);color:#fdf0e0;
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;border-radius:0 20px 20px 0;overflow:hidden;z-index:30}
.brand{padding:22px 18px 14px;display:flex;align-items:center;gap:10px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:21px}
.brand .logo{font-size:15.5px;font-weight:700;color:#fff;line-height:1.35}
.brand .sub{font-size:10.5px;color:#ffffffb8;letter-spacing:.4px}
.nav{flex:1;overflow-y:auto;padding:4px 12px 18px}
.nav .grp{font-size:11px;color:#ffffffa0;padding:14px 12px 6px;letter-spacing:1.5px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#fdf0e0;
  font-size:13.5px;padding:9px 12px;text-align:left;border-radius:11px;margin:1px 0;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button.on{background:rgba(255,255,255,.22);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.nav button .ic{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13.5px;flex:0 0 26px}
.side-foot{padding:12px 18px;font-size:11px;color:#ffffff90;border-top:1px solid rgba(255,255,255,.15)}
.main{margin-left:230px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;height:58px}
.topbar h2{font-size:15px;font-weight:700;color:var(--brand-d);display:flex;align-items:center;gap:8px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.topbar .link{font-size:12.5px;color:var(--muted);text-decoration:none}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand-l),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.who .nm{font-size:13px;font-weight:600}
.who .rl{font-size:11px;color:var(--muted)}
.btnout{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 16px;font-size:12.5px;color:var(--muted)}
.btnout:hover{color:var(--danger);border-color:#f0c9c7}
.pgttl{padding:20px 26px 0}
.pgttl h2{font-size:19px;font-weight:700;color:#2b241a}
.pgttl .desc{font-size:12.5px;color:var(--muted);margin-top:4px}
.content{padding:18px 26px 40px}
.btn{border:none;border-radius:8px;padding:8px 15px;font-size:13px;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#faf7f2}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn.gray{background:#eef2f1;color:#4d5a56}
.btn.danger{background:#fdf0ef;color:var(--danger)}
.btn.warn{background:#fdf3e6;color:#b9711f}
.btn.blk{width:100%;padding:11px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-h h3{font-size:14.5px;font-weight:600;color:#2b241a}
.card-h h3::before{content:'';width:4px;height:15px;background:var(--brand);border-radius:2px;margin-right:8px;display:inline-block;vertical-align:-2px}
.card-h .hint{font-size:12px;color:var(--muted)}
.card-h .act{margin-left:auto;display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:9px 10px;background:#faf8f4;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:13px;padding:10px;border-bottom:1px solid #f2f2ee;vertical-align:middle}
tbody tr:hover{background:#fbfaf7}
.empty{padding:36px 0;text-align:center;color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;line-height:1.7;white-space:nowrap}
.ok{background:#e6f6ef;color:#0f8a5f}
.off{background:#f0f2f2;color:#8a9a95}
.warn{background:#fdf3e6;color:#b9711f}
.bad{background:#fdf0ef;color:#c0453f}
.info{background:#eaf1fc;color:#2b6ca8}
.mono{font-family:consolas,monospace;font-size:12.5px;color:#4a5b56}
select,input,textarea{border:1px solid #e0ddd4;border-radius:8px;padding:8px 11px;font-size:13px;outline:none;background:#fff;font-family:inherit;color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--brand-l);box-shadow:0 0 0 3px rgba(217,122,31,.1)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.frow{display:flex;gap:12px}.frow .fld{flex:1}
.rowline{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f2f2ee}
.rowline:last-child{border-bottom:none}
.rowline .grow{flex:1;min-width:0}
.rowline .t1{font-size:13.5px;font-weight:600}
.rowline .t2{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.albox{background:#fff7e8;border:1px solid #ffe1ad;border-radius:12px;padding:10px 14px;font-size:12.5px;margin:12px 0;line-height:1.8}
.albox b{color:var(--warn)}
.banner{background:linear-gradient(120deg,var(--brand),var(--brand-l) 60%,var(--brand-d));border-radius:16px;color:#fff;padding:24px 28px;display:flex;align-items:center;gap:18px;box-shadow:0 14px 30px rgba(120,80,20,.2)}
.banner .wt{font-size:20px;font-weight:800}
.banner .wd{font-size:12.5px;opacity:.9;margin-top:6px;line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:800;margin-top:6px;color:var(--brand-d)}
.kpi .v.blue{color:var(--blue)}.kpi .v.bad{color:var(--danger)}.kpi .v.warn{color:var(--warn)}
.bdtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bdtabs button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 16px;font-size:12.8px;color:#5b5548;cursor:pointer;font-family:inherit}
.bdtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.statusrow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px}
.trendbar{height:14px;background:#f0eee8;border-radius:7px;overflow:hidden;flex:1}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-16px);background:#2b241a;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:70vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#a8382f}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">
      <div class="mark">🏥</div>
      <div><div class="logo" id="brandName">运营管理端<br><span class="sub">OPERATIONS CONSOLE</span></div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">运营管理</div>
      <button data-v="dash" class="on"><span class="ic">◎</span>运营总览</button>
      <button data-v="apptmgt"><span class="ic">📅</span>预约管理</button>
      <button data-v="sched"><span class="ic">🗓</span>排班管理</button>
      <div class="grp">经营分析</div>
      <button data-v="perf"><span class="ic">📊</span>业绩核算</button>
      <button data-v="perfall" id="mPerfall"><span class="ic">🏆</span>医生业绩一览</button>
      <button data-v="stores" id="mStores"><span class="ic">🏠</span>门店一览</button>
      <div class="grp">内容与数据</div>
      <button data-v="notice"><span class="ic">📢</span>公告管理</button>
      <button data-v="staff"><span class="ic">👥</span>人员账号</button>
      <button data-v="bd"><span class="ic">🗂</span>基础数据管理</button>
    </nav>
    <div class="side-foot">牙科连锁 · 运营管理端（网页版）</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2>🏥 牙科连锁 · 运营管理</h2>
      <div class="right">
        <a class="link" href="/index.html">返回官网</a>
        <a class="link" href="/admin.html">系统管理门户</a>
        <button class="btnout" onclick="logout()">退出登录</button>
        <div class="who">
          <div class="avatar" id="whoAvatar">管</div>
          <div><div class="nm" id="whoName">—</div><div class="rl" id="whoRole">管理端</div></div>
        </div>
      </div>
    </div>
    <div class="pgttl">
      <h2 id="pgTitle">运营总览</h2>
      <div class="desc" id="pgDesc">门店运营指标与近期动态</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const API='/api';
const SLOTS={1:'上午',2:'下午',3:'晚间'};
const AS={0:'已提交',1:'已确认',2:'已到诊',3:'诊疗中',4:'已完成',5:'已取消',6:'爽约'};
let me=null,stores=[],doctors=[],items=[];

function toast(t,ok=true){const el=document.getElementById('toast');el.textContent=t;el.className=ok?'on':'on err';setTimeout(()=>el.className='',2600)}
async function api(p,opt={}){
  const r=await fetch(API+p,{method:opt.method||'GET',headers:{'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json();
  if(j.code!==200&&j.code!==0){toast(j.msg||'请求失败',false);throw new Error(j.msg)}
  return j.data;
}
/* 演示快捷登录：?demo=账号（默认密码 123456） */
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('demo')){
    api('/auth/login',{method:'POST',body:{account:q.get('demo'),password:q.get('pwd')||'123456'}}).then(d=>{
      d.account=q.get('demo');
      sessionStorage.setItem('dental_me',JSON.stringify(d));
      location.href=location.pathname+(location.hash||'');
    });
  }
})();
me=JSON.parse(sessionStorage.getItem('dental_me')||'null');
const __demo=new URLSearchParams(location.search).get('demo');
if(!me&&__demo){/* 演示登录进行中：等待写入凭证后自动刷新 */}
else if(!me||(me.role!=='storeAdmin'&&me.role!=='hqAdmin')){location.href='/index.html';throw new Error('redirect')}
document.getElementById('app').style.display='flex';
document.getElementById('whoName').textContent=me.user.realName;
document.getElementById('whoAvatar').textContent=(me.user.realName||'管').slice(0,1);
const isHq=me.role==='hqAdmin';
/* 主题色：门店橙 / 总部紫 */
if(isHq){
  const rs=document.documentElement.style;
  rs.setProperty('--brand','#6f4be0');rs.setProperty('--brand-d','#5433b8');
  rs.setProperty('--brand-l','#8a68ee');rs.setProperty('--brand-bg','#efeaff');
  document.getElementById('brandName').innerHTML='总部管理端<br><span class="sub">HEADQUARTERS CONSOLE</span>';
}
document.getElementById('whoRole').textContent=(isHq?'总部管理员':'门店管理员')+' · '+me.account;
if(!isHq){
  document.getElementById('mPerfall').style.display='none';
  document.getElementById('mStores').style.display='none';
}
function logout(){sessionStorage.removeItem('dental_me');location.href='/index.html'}

const VIEWS={};
const META={
  dash:['运营总览','营收（医保报销 + 个人自付）、取消率、号源利用率与近 7 日趋势'],
  apptmgt:['预约管理','今日预约确认与到院核销签到'],
  sched:['排班管理','创建、发布与停用医生排班号源'],
  perf:['业绩核算','按医生/季度试算提成并确认生效'],
  perfall:['医生业绩一览','全部门店医生季度核算确认（总部）'],
  stores:['门店一览','连锁门店档案与营业状态（总部）'],
  notice:['公告管理','面向患者的公告发布与下架'],
  staff:['人员账号','工作人员增减、账号状态与角色归属'],
  bd:['基础数据管理','牙医、牙椅、项目、供应商、日历、资质、耗材、账单、角色']
};
const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>v===null||v===undefined?'-':'¥ '+Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

function setView(v){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const m=META[v]||['运营管理',''];
  document.getElementById('pgTitle').textContent=m[0];
  document.getElementById('pgDesc').textContent=m[1];
  location.hash=v;
  document.getElementById('content').innerHTML='<div class="empty">加载中…</div>';
  VIEWS[v]().catch(e=>{document.getElementById('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)setView(b.dataset.v)});

async function loadBase(){
  stores=await api('/common/stores');
  doctors=await api('/common/doctors');
  items=await api('/common/items');
}

/* ================= 运营总览 ================= */
VIEWS.dash=async()=>{
  if(!stores.length)await loadBase();
  const t=await api('/stats/today');
  let h='<div class="banner"><div><div class="wt">'+(isHq?'🏢 总部运营驾驶舱':'🏪 门店运营工作台')+' · '+esc(me.user.realName)+'</div>'+
    '<div class="wd">今日预约 <b>'+t.total+'</b> 人 · 已到诊 <b>'+t.checkedIn+'</b> · 待确认 <b>'+t.pendingConfirm+'</b> · 已完成 <b>'+t.completed+'</b></div></div>'+
    '<div style="margin-left:auto;display:flex;gap:10px"><button class="btn" style="background:#fff;color:var(--brand-d);font-weight:600;border-radius:20px;padding:10px 20px" onclick="setView(\'apptmgt\')">处理今日预约</button></div></div>';
  h+='<div class="card" style="margin-top:16px"><div class="card-h"><h3>运营指标</h3><span class="hint">按门店筛选（全部门店可看整体）</span>'+
    '<div class="act"><select id="mStore" onchange="loadStats()" style="width:160px"><option value="">全部门店</option>'+
    stores.map(s=>'<option value="'+s.storeId+'">'+esc(s.storeName)+'</option>').join('')+'</select></div></div>'+
    '<div class="kpis" id="kpis"></div><div id="statusRow" style="margin-top:14px"></div></div>';
  h+='<div class="card"><div class="card-h"><h3>近 7 日营收趋势</h3></div><div id="trendList"><div class="empty">加载中...</div></div></div>';
  h+='<div class="two">';
  h+='<div class="card"><div class="card-h"><h3>门店概览</h3><div class="act">'+(isHq?'<button class="btn ghost sm" onclick="setView(\'stores\')">门店一览</button>':'')+'</div></div>'+
    stores.map(s=>'<div class="rowline"><div style="font-size:20px">🏪</div>'+
    '<div class="grow"><div class="t1">'+esc(s.storeName)+' <span class="mono" style="font-weight:400">'+esc(s.storeCode||'')+'</span></div>'+
    '<div class="t2">'+esc(s.address||'-')+' · '+esc(s.phone||'-')+(s.chairCount!=null?' · 牙椅 '+s.chairCount+' 台':'')+(s.doctorCount!=null?' · 医生 '+s.doctorCount+' 人':'')+'</div></div>'+
    (s.status===1?'<span class="tag ok">营业中</span>':'<span class="tag off">停业</span>')+'</div>').join('')+'</div>';
  h+='<div class="card"><div class="card-h"><h3>门诊公告</h3><div class="act"><button class="btn ghost sm" onclick="setView(\'notice\')">公告管理</button></div></div><div id="dashNotices"><div class="empty">加载中...</div></div></div>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
  loadStats();
  api('/notice/all').then(list=>{
    const el=document.getElementById('dashNotices');
    el.innerHTML=list.length?list.slice(0,4).map(n=>'<div class="rowline" style="padding:7px 2px">'+
      '<div class="grow"><div class="t1" style="font-size:13px">'+esc(n.title)+'</div>'+
      '<div class="t2">'+esc((n.publishTime||'').slice(0,10))+'</div></div>'+
      (n.status===1?'<span class="tag ok">已发布</span>':'<span class="tag off">已下架</span>')+'</div>').join(''):'<div class="empty">暂无公告</div>';
  }).catch(()=>{});
};
async function loadStats(){
  const sid=document.getElementById('mStore').value;
  const s=await api('/stats/overview'+(sid?'?storeId='+sid:''));
  const k=(k,v,c='')=>'<div class="kpi"><div class="k">'+k+'</div><div class="v '+c+'">'+v+'</div></div>';
  document.getElementById('kpis').innerHTML=
    k('累计营收','¥'+s.paidRevenue)+
    k('医保统筹报销','¥'+(s.insuranceRevenue||0),'blue')+
    k('个人自付收入','¥'+(s.selfRevenue||0),'warn')+
    k('取消率（目标≤8%）',s.cancelRate+'%',s.cancelRateAchieved?'':'bad')+
    k('号源利用率',s.quotaUsageRate+'%','blue')+
    k('可用牙椅',s.chairsAvailable+' 张','warn');
  const d=s.appointmentStatus;
  document.getElementById('statusRow').innerHTML='<div class="statusrow">'+
    ['已提交','已确认','已到诊','诊疗中','已完成','已取消','爽约'].map(n=>'<div><div style="color:var(--muted)">'+n+'</div><div style="font-size:16px;font-weight:700;margin-top:3px">'+d[n]+'</div></div>').join('')+'</div>';
  const list=await api('/stats/revenue-trend'+(sid?'?storeId='+sid:'')).catch(()=>[]);
  const max=Math.max(...list.map(d=>d.revenue),1);
  document.getElementById('trendList').innerHTML=list.map(d=>'<div style="display:flex;align-items:center;gap:10px;margin:7px 0">'+
    '<span style="font-size:11px;color:var(--muted);width:76px">'+d.date.slice(5)+'</span>'+
    '<div class="trendbar"><div style="height:100%;width:'+(d.revenue/max*100).toFixed(1)+'%;background:linear-gradient(90deg,var(--brand-l),var(--brand));border-radius:7px"></div></div>'+
    '<b style="font-size:12.5px;min-width:70px;text-align:right">¥'+d.revenue+'</b></div>').join('');
}

/* ================= 预约管理 ================= */
VIEWS.apptmgt=async()=>{
  const list=await api('/appointment/today');
  let h='<div class="card"><div class="card-h"><h3>今日预约（确认 / 核销）</h3><span class="hint">待确认点「确认」；患者到院后点「核销签到」进入候诊队列</span>'+
    '<div class="act"><button class="btn ghost sm" onclick="setView(\'apptmgt\')">刷新</button></div></div>';
  h+=list.length?'<table><thead><tr><th>预约号</th><th>患者</th><th>医生</th><th>时段</th><th>挂号费</th><th>状态</th><th style="width:130px">操作</th></tr></thead><tbody>'+
    list.map(a=>'<tr><td class="mono">'+esc(a.appointmentNo)+'</td><td><b>'+esc(a.patientName)+'</b></td><td>'+esc(a.doctorName||'-')+'</td>'+

        '<div class="frow">'+fldHtml('项目编码','iCode','ITM-NEW')+fldHtml('项目名称','iName')+'</div>'+
        '<div class="frow">'+fldHtml('类别','iCat','补牙')+fldHtml('单位','iUnit','次')+'</div>'+
        '<div class="frow">'+fldHtml('标准价¥','iPrice','','number')+fldHtml('材料成本¥','iCost','0','number')+'</div>'+
        '<div class="frow"><div class="fld"><label>医保属性</label><select id="iIns"><option value="甲类">甲类（全额报销）</option><option value="乙类">乙类（报销 70%）</option><option value="自费" selected>自费</option></select></div></div>'+
        '<button class="btn blk" onclick="saveItem()">新增项目</button></div>'+
        '<table><thead><tr><th>编码</th><th>项目</th><th>类别</th><th>定价</th><th>材料成本</th><th>医保</th><th>状态</th><th style="width:100px">操作</th></tr></thead><tbody>'+
        list.map(i=>'<tr><td class="mono">'+esc(i.itemCode)+'</td><td><b>'+esc(i.itemName)+'</b></td><td>'+esc(i.category||'-')+'</td>'+
        '<td>'+money(i.price)+'</td><td>'+money(i.materialCost)+'</td>'+
        '<td>'+(i.insuranceType==='甲类'?'<span class="tag ok">甲类·全额</span>':i.insuranceType==='乙类'?'<span class="tag info">乙类·70%</span>':'<span class="tag off">自费</span>')+'</td>'+
        '<td>'+(i.status===1?'<span class="tag ok">启用</span>':'<span class="tag off">停用</span>')+'</td>'+
        '<td><button class="btn ghost sm" onclick="toggleItem('+i.itemId+','+i.status+')">'+(i.status===1?'停用':'启用')+'</button></td></tr>').join('')+
        '</tbody></table>';
    }else if(bdTab==='suppliers'){
      const list=await api('/admin/suppliers');
      el.innerHTML='<div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:12px">'+
        '<div class="frow">'+fldHtml('供应商名称','spName')+fldHtml('联系人','spContact')+'</div>'+
        '<div class="frow">'+fldHtml('电话','spPhone')+fldHtml('供货范围','spScope','耗材')+'</div>'+
        '<button class="btn blk" onclick="saveSupplier()">新增供应商</button></div>'+
        '<table><thead><tr><th>供应商</th><th>联系人</th><th>电话</th><th>供货范围</th><th>状态</th></tr></thead><tbody>'+
        (list.length?list.map(s=>'<tr><td><b>'+esc(s.supplierName)+'</b></td><td>'+esc(s.contactPerson||'-')+'</td><td>'+esc(s.phone||'-')+'</td>'+
        '<td>'+esc(s.supplyScope||'-')+'</td><td>'+(s.status===1?'<span class="tag ok">合作中</span>':'<span class="tag off">已终止</span>')+'</td></tr>').join(''):'<tr><td colspan="5"><div class="empty">暂无供应商</div></td></tr>')+
        '</tbody></table>';
    }else if(bdTab==='calendar'){
      const list=await api('/admin/calendar');
      el.innerHTML='<div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:12px">'+
        '<div class="frow"><div class="fld"><label>门店</label><select id="kStore">'+storeOpts()+'</select></div>'+fldHtml('日期','kDate',new Date().toISOString().slice(0,10),'date')+'</div>'+
        '<div class="frow"><div class="fld"><label>日类型</label><select id="kType"><option value="1">工作日</option><option value="2">法定节假日</option><option value="3">调休补班</option></select></div>'+
        '<div class="fld"><label>备注</label><input id="kRem" placeholder="如：国庆节"></div>'+
        '<div class="fld" style="flex:0 0 160px;display:flex;align-items:flex-end"><button class="btn" style="width:100%" onclick="saveCalendar()">保存日历设置</button></div></div></div>'+
        '<table><thead><tr><th>日期</th><th>类型</th><th>备注</th></tr></thead><tbody>'+
        (list.length?list.map(c=>'<tr><td>'+c.calDate+'</td><td>'+(c.dayType===2?'<span class="tag bad">节假日</span>':c.dayType===3?'<span class="tag info">补班</span>':'<span class="tag ok">工作日</span>')+'</td><td>'+esc(c.remark||'')+'</td></tr>').join(''):'<tr><td colspan="3"><div class="empty">默认全部为工作日</div></td></tr>')+
        '</tbody></table>';
    }else if(bdTab==='purch'){
      const list=await api('/admin/purchases');
      const sups=await api('/common/suppliers').catch(()=>[]);
      el.innerHTML='<div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:12px">'+
        '<div class="frow">'+fldHtml('品名','pName')+fldHtml('数量','pQty','1','number')+'</div>'+
        '<div class="frow"><div class="fld"><label>类型</label><select id="pType"><option value="2">耗材</option><option value="1">设备</option><option value="3">药品</option></select></div>'+
        fldHtml('进价¥','pPrice','','number')+'</div>'+
        '<div class="frow"><div class="fld"><label>门店</label><select id="pStore">'+storeOpts()+'</select></div>'+
        '<div class="fld"><label>供应商</label><select id="pSup">'+sups.map(s=>'<option value="'+s.supplierId+'">'+esc(s.supplierName)+'</option>').join('')+'</select></div></div>'+
        '<button class="btn blk" onclick="savePurchase()">采购入库（自动计总额）</button></div>'+
        '<table><thead><tr><th>品名</th><th>日期</th><th>供应商</th><th>数量×单价</th><th>总额</th></tr></thead><tbody>'+
        (list.length?list.slice(0,12).map(p=>'<tr><td><b>'+esc(p.itemName)+'</b></td><td>'+p.purchaseDate+'</td><td>'+esc(p.supplierName||'-')+'</td>'+
        '<td>'+p.quantity+'×¥'+p.unitPrice+'</td><td><b>'+money(p.totalAmount)+'</b></td></tr>').join(''):'<tr><td colspan="5"><div class="empty">暂无采购记录</div></td></tr>')+
        '</tbody></table>';
    }else if(bdTab==='bills'){
      const list=await api('/admin/bills');
      const bn={0:'待支付',1:'已支付',2:'已开票',3:'部分退款',4:'全额退款'},bc={0:'warn',1:'info',2:'ok',3:'bad',4:'off'};
      el.innerHTML='<table><thead><tr><th>单号</th><th>患者</th><th>渠道</th><th>应收</th><th>挂号抵扣</th><th>状态</th><th style="width:100px">操作</th></tr></thead><tbody>'+
        (list.length?list.map(b=>'<tr><td class="mono">'+esc(b.billNo)+'</td><td>'+esc(b.patientName||'-')+'</td><td>'+esc(b.payChannel||'-')+'</td>'+
        '<td>'+money(b.payable)+'</td><td>'+money(b.discount)+'</td>'+
        '<td><span class="tag '+bc[b.status]+'">'+(bn[b.status]||b.status)+'</span></td><td>'+
        (b.status===1?'<button class="btn sm" onclick="invoiceBill('+b.billId+')">开票</button>':'')+'</td></tr>').join(''):'<tr><td colspan="7"><div class="empty">暂无账单</div></td></tr>')+
        '</tbody></table><div class="albox">💡 核查规则：账单生成后金额不可修改；已支付账单可开具电子发票；有异议的账单走退款红冲流程并记录审计轨迹。</div>';
    }else if(bdTab==='quals'){
      const list=await api('/admin/qualifications');
      el.innerHTML='<table><thead><tr><th>医生</th><th>资质名称</th><th>证书号</th><th>发证机构</th><th>有效期至</th><th>审核状态</th><th style="width:210px">操作</th></tr></thead><tbody>'+
        (list.length?list.map(q=>'<tr><td><b>'+esc(q.doctorName)+'</b></td><td>'+esc(q.qualName)+'</td><td class="mono">'+esc(q.certNo||'-')+'</td>'+
        '<td>'+esc(q.issueOrg||'-')+'</td><td>'+esc(q.expireDate||'-')+'</td>'+
        '<td>'+(q.auditStatus===2?'<span class="tag ok">终审通过</span>':q.auditStatus===3?'<span class="tag off">已驳回</span>':q.auditStatus===1?'<span class="tag info">初审通过</span>':'<span class="tag warn">待初审</span>')+'</td><td>'+
        (q.auditStatus<2?'<button class="btn sm" onclick="auditQual('+q.qualificationId+',1)">初审通过</button> '+
        '<button class="btn sm" style="background:#2b7cd3" onclick="auditQual('+q.qualificationId+',2)">终审通过</button> '+
        '<button class="btn warn sm" onclick="auditQual('+q.qualificationId+',3)">驳回</button>':'')+'</td></tr>').join(''):'<tr><td colspan="7"><div class="empty">暂无资质记录</div></td></tr>')+
        '</tbody></table>';
    }else{
      const roles=await api('/admin/roles');
      const rps=await api('/admin/role-permissions');
      const pm=Object.fromEntries(rps.map(r=>[r.roleId,r.permNames]));
      el.innerHTML='<table><thead><tr><th>角色</th><th>编码</th><th>人数</th><th>权限点</th></tr></thead><tbody>'+
        roles.map(r=>'<tr><td><b>'+esc(r.roleName)+'</b></td><td class="mono">'+esc(r.roleCode)+'</td>'+
        '<td><span class="tag info">'+r.userCount+' 人</span></td><td style="font-size:12px;color:#5b5548">'+esc((pm[r.roleId]||[]).join(' · ')||'无权限')+'</td></tr>').join('')+
        '</tbody></table><div class="sect-t"></div>'+
        '<div style="margin-top:10px;font-size:12.5px;color:var(--muted)">权限点：</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+
        (await api('/admin/permissions')).map(p=>'<span class="tag info">'+esc(p.permName)+'</span>').join('')+'</div>';
    }
  }catch(e){el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}
}
async function saveDoctor(){
  const body={realName:v('dName'),jobNo:v('dJob'),title:v('dTitle'),specialty:v('dSpec'),
    practiceNo:v('dPrac'),phone:v('dPhone'),homeStoreId:+v('dStore')};
  if(!body.realName||!body.jobNo){toast('姓名与工号必填',false);return}
  await api('/admin/doctors',{method:'POST',body});
  toast('牙医已新增，账号 '+body.jobNo+'，初始密码 123456');renderBD();
}
async function saveChair(){
  await api('/admin/chairs',{method:'POST',body:{chairNo:v('cNo'),deviceName:v('cDev'),storeId:+v('cStore'),
    purchasePrice:v('cPrice')||80000,purchaseDate:new Date().toISOString().slice(0,10),deprecYears:+v('cDep')||8,
    perUseCost:v('cUse')||50,status:1}});
  toast('牙椅已新增');renderBD();
}
async function setChairStatus(id,st){await api('/admin/chairs/'+id+'/update',{method:'POST',body:{status:st}});toast('牙椅状态已更新');renderBD()}
async function saveItem(){
  if(!v('iName')||!v('iPrice')){toast('名称与价格必填',false);return}
  const ins=document.getElementById('iIns').value;
  await api('/admin/items',{method:'POST',body:{itemCode:v('iCode')||('ITM-'+Date.now()%10000),itemName:v('iName'),
    category:v('iCat'),unit:v('iUnit')||'次',price:v('iPrice'),materialCost:v('iCost')||0,status:1,
    insuranceType:ins,insuranceRate:ins==='甲类'?1:ins==='乙类'?0.7:0}});
  toast('项目已新增');renderBD();
}
async function toggleItem(id,st){await api('/admin/items/'+id+'/update',{method:'POST',body:{status:st===1?0:1}});toast(st===1?'已停用':'已启用');renderBD()}
async function saveSupplier(){
  if(!v('spName')){toast('请输入供应商名称',false);return}
  await api('/admin/suppliers',{method:'POST',body:{supplierName:v('spName'),contactPerson:v('spContact'),
    phone:v('spPhone'),supplyScope:v('spScope'),status:1}});
  toast('供应商已新增');renderBD();
}
async function saveCalendar(){
  await api('/admin/calendar/set',{method:'POST',body:{storeId:+v('kStore'),calDate:v('kDate'),
    dayType:+v('kType'),remark:v('kRem')}});
  toast('日历已设置');renderBD();
}
async function auditQual(id,st){await api('/admin/qualifications/'+id+'/audit?auditStatus='+st,{method:'POST'});toast('审核完成');renderBD()}
async function savePurchase(){
  if(!v('pName')||!v('pPrice')){toast('品名与进价必填',false);return}
  await api('/admin/purchases',{method:'POST',body:{itemName:v('pName'),itemType:+v('pType'),
    quantity:+v('pQty')||1,unitPrice:v('pPrice'),storeId:+v('pStore'),supplierId:+v('pSup'),
    operatorId:me.user.userId}});
  toast('采购已入库');renderBD();
}
async function invoiceBill(id){await api('/admin/bills/'+id+'/invoice',{method:'POST'});toast('电子发票已开具');renderBD()}
async function delBD(kind,id){if(!confirm('确认删除？'))return;await api('/admin/'+kind+'/'+id+'/delete',{method:'POST'});toast('已删除');renderBD()}

/* ================= 启动 ================= */
loadBase().then(()=>{
  const v=(location.hash||'#dash').slice(1);
  setView(META[v]?v:'dash');
});
</script>
</body>
