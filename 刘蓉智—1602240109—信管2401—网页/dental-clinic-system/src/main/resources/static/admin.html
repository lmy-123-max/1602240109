<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牙科连锁 · 管理后台</title>
<style>
:root{
  --brand:#1a56d6; --brand-d:#1341a8; --brand-l:#3b74e6; --brand-bg:#e8effc;
  --ink:#1b2320; --muted:#7c8a86; --line:#e4eaf3; --bg:#f2f6fb;
  --warn:#d9822b; --danger:#d9534f; --teal:#0f9d76;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
/* ---------- 布局：门户式 ---------- */
.app{display:flex;min-height:100vh}
.side{width:230px;background:linear-gradient(185deg,#1e5ce4 0%,#1443b4 78%,#123a99 100%);color:#dce7ff;
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;border-radius:0 20px 20px 0;overflow:hidden;z-index:30}
.brand{padding:22px 18px 14px;display:flex;align-items:center;gap:10px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:21px}
.brand .logo{font-size:15.5px;font-weight:700;color:#fff;line-height:1.35}
.brand .sub{font-size:10.5px;color:#a8c0f2;letter-spacing:.4px}
.nav{flex:1;overflow-y:auto;padding:4px 12px 18px}
.nav .grp{font-size:11px;color:#9db9ec;padding:14px 12px 6px;letter-spacing:1.5px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#dce7ff;
  font-size:13.5px;padding:9px 12px;text-align:left;border-radius:11px;margin:1px 0;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.nav button .ic{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:13.5px;flex:0 0 26px}
.side-foot{padding:12px 18px;font-size:11px;color:#8aa6d8;border-top:1px solid rgba(255,255,255,.12)}
.main{margin-left:230px;flex:1;min-width:0;display:flex;flex-direction:column}
/* 顶栏：门户式（桌面切换 + 全局搜索 + 用户区） */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:20;height:58px}
.desktabs{display:flex;gap:4px;background:#eef3fa;border-radius:20px;padding:4px}
.desktabs button{border:none;background:none;border-radius:16px;padding:6px 16px;font-size:13px;color:#5b6b8c}
.desktabs button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 4px rgba(26,86,214,.18)}
.gsearch{margin:0 auto;width:min(430px,34vw)}
.gsearch input{width:100%;border:1px solid #e2e9f5;border-radius:20px;padding:8px 16px;font-size:13px;background:#f6f9fd;outline:none;color:var(--ink)}
.gsearch input:focus{border-color:var(--brand-l);background:#fff;box-shadow:0 0 0 3px rgba(26,86,214,.08)}
.gs-pop{position:fixed;top:56px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(16,42,100,.14);
  z-index:90;overflow:hidden;min-width:300px;display:none}
.gs-pop .gi{padding:9px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px}
.gs-pop .gi:hover{background:#f2f6fd}
.gs-pop .gi .ic{font-size:15px}
.gs-pop .gi .cat{margin-left:auto;font-size:11px;color:#9aa8c6}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:none;background:#f1f5fb;color:#5b6b8c;font-size:15px;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:#e3ebf7;color:var(--brand)}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b74e6,#1a56d6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.who .nm{font-size:13px;font-weight:600;color:var(--ink)}
.who .rl{font-size:11px;color:var(--muted)}
.pgttl{padding:20px 26px 0}
.pgttl h2{font-size:19px;font-weight:700;color:#13233f}
.pgttl .desc{font-size:12.5px;color:var(--muted);margin-top:4px}
.content{padding:18px 26px 40px}
/* ---------- 组件 ---------- */
.btn{border:none;border-radius:8px;padding:8px 15px;font-size:13px;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f6f9fd;border-color:#c9d6ec}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn.gray{background:#eef2f7;color:#4d5a70}
.btn.gray:hover{background:#e3e9f2}
.btn.danger{background:#fdf0ef;color:var(--danger)}
.btn.danger:hover{background:#fbe3e1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-h h3{font-size:14.5px;font-weight:600;color:#13233f}
.card-h h3::before{content:'';width:4px;height:15px;background:var(--brand);border-radius:2px;margin-right:8px;display:inline-block;vertical-align:-2px}
.card-h .hint{font-size:12px;color:var(--muted)}
.card-h .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .lb{font-size:12.5px;color:var(--muted)}
.stat .vl{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px;color:#13233f}
.stat .vl small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.stat .bar{height:3px;background:var(--brand-bg);margin-top:12px;border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--brand-l)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:9px 10px;background:#f7f9fd;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{font-size:13px;padding:10px;border-bottom:1px solid #f1f4f9;vertical-align:middle}
tbody tr:hover{background:#f8faff}
.tw{overflow:auto;max-height:calc(100vh - 320px);border:1px solid var(--line);border-radius:10px}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;line-height:1.7;white-space:nowrap}
.ok{background:#e6f6ef;color:#0f8a5f}
.off{background:#f0f2f2;color:#8a9a95}
.warn{background:#fdf3e6;color:#b9711f}
.bad{background:#fdf0ef;color:#c0453f}
.info{background:#eaf1fc;color:#2b6ca8}
.mono{font-family:consolas,monospace;font-size:12.5px;color:#4a5b70}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{
  border:1px solid #dbe3f0;border-radius:8px;padding:8px 11px;font-size:13px;outline:none;background:#fff;font-family:inherit;color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--brand-l);box-shadow:0 0 0 3px rgba(26,86,214,.1)}
.grow{flex:1;min-width:0}
/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,26,48,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dlg-h h3{font-size:15px}
.dlg-h .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
.dlg-b{padding:18px 20px;overflow-y:auto}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#f8fafd}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%}
.frow{display:flex;gap:12px}.frow .fld{flex:1}
.hintline{font-size:12px;color:var(--muted);line-height:1.7}
/* ---------- 提示 ---------- */
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-16px);background:#13233f;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:70vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#a8382f}
/* ---------- 登录 ---------- */
.gate{position:fixed;inset:0;background:linear-gradient(140deg,#0f2f6e,#1e5ce4 55%,#123a99);display:flex;align-items:center;justify-content:center;z-index:300}
.gate .box{width:352px;background:#fff;border-radius:16px;padding:28px 26px 24px;box-shadow:0 24px 60px rgba(6,20,50,.4)}
.gate h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;color:#13233f}
.gate p.t{font-size:12.5px;color:var(--muted);margin:6px 0 20px}
.gate .fld input{width:100%}
.gate .btn{width:100%;padding:11px;font-size:14px;margin-top:6px}
.gate .tip{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.7;background:#f4f8fe;padding:10px;border-radius:8px}
/* 权限矩阵 */
.matrix td.ck{text-align:center}
.matrix input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.storegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.store{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.store .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.store .cd{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.5px}
.store .meta{font-size:12.5px;color:#5b6a80;margin-top:12px;line-height:1.9}
.store .meta b{color:var(--ink);font-weight:600}
.store .ops{margin-top:12px;display:flex;gap:8px}
.notice{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.notice+.notice{margin-top:10px}
.notice .tt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.notice .cc{font-size:13px;color:#5b6a80;line-height:1.8;margin-top:8px}
.notice .ft{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;gap:14px;align-items:center}
/* 分页条 */
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 4px 2px;font-size:12.5px;color:var(--muted)}
.pager button{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:#3f4d60;font-size:12.5px}
.pager button:disabled{opacity:.45;cursor:not-allowed}
.pager button:not(:disabled):hover{border-color:var(--brand);color:var(--brand)}
/* 数据维护页 */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dl .box{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.dl .box h4{font-size:14px;margin:0 0 6px}
.dl .box p{font-size:12.5px;color:var(--muted);line-height:1.8;margin:0 0 12px}
.dl .box code{font-size:11.5px;background:#f3f6fc;padding:2px 6px;border-radius:4px;color:#3f4d60}
.bk-name{font-family:Menlo,Consolas,monospace;font-size:12.5px}
/* ---------- 门户工作台首页 ---------- */
.wbanner{background:linear-gradient(120deg,#1a56d6,#2f6ce8 55%,#3b74e6);border-radius:16px;color:#fff;padding:24px 28px;
  display:flex;align-items:center;gap:18px;box-shadow:0 14px 30px rgba(26,86,214,.22)}
.wbanner .wt{font-size:21px;font-weight:800}
.wbanner .wd{font-size:12.5px;opacity:.88;margin-top:6px;line-height:1.7}
.wbanner .btns{margin-left:auto;display:flex;gap:10px}
.wbanner .btns button{border:none;border-radius:20px;padding:9px 20px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.wbanner .btns .b1{background:#fff;color:#1a56d6}
.wbanner .btns .b2{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.appchips{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.appchips button{border:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 18px;font-size:13px;color:#5b6b8c;cursor:pointer;font-family:inherit}
.appchips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.appcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;cursor:pointer;transition:.2s;position:relative}
.appcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(16,42,100,.12);border-color:#c6d6f0}
.appcard .aic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;margin-bottom:11px}
.appcard .nm{font-size:14px;font-weight:700;color:#13233f}
.appcard .ds{font-size:11.8px;color:#8a95ab;margin-top:5px;line-height:1.65;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.appcard .go{position:absolute;top:14px;right:14px;font-size:11px;color:#b9c6de;opacity:0;transition:.2s}
.appcard:hover .go{opacity:1;color:var(--brand)}
.quickline{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.quickline button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-size:12.8px;color:#3d4a63;cursor:pointer;font-family:inherit}
.quickline button:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <h1>🦷 牙科连锁 · 管理门户</h1>
    <p class="t">统一工作台：门店、人员、项目、权限与经营数据的集中管理入口</p>
    <div class="fld"><label>账号</label><input id="gAcc" value="hq001" autocomplete="username"></div>

<script>
/* ==================== 基础设施 ==================== */
const API = '/api';
const state = { me: null, stores: [], doctors: [], items: [], suppliers: [], users: [], roles: [], perms: [], rolePerms: [] };

function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on' + (ok ? '' : ' err');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = '', 2400);
}

async function api(path, opt = {}) {
  const o = { method: opt.method || 'GET' };
  if (opt.body !== undefined) {
    o.headers = { 'Content-Type': 'application/json' };
    o.body = JSON.stringify(opt.body);
  }
  let res, json;
  try { res = await fetch(API + path, o); } catch (e) { throw new Error('无法连接服务，请确认后端已启动'); }
  try { json = await res.json(); } catch (e) { throw new Error('服务返回异常（HTTP ' + res.status + '）'); }
  if (json.code !== 0) throw new Error(json.msg || '请求失败');
  return json.data;
}

const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = v => v === null || v === undefined ? '-' : '¥ ' + Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateOf = v => v ? String(v).slice(0, 10) : '-';
const genderTxt = g => g === 1 ? '男' : g === 0 ? '女' : '-';

function tag(text, cls) { return '<span class="tag ' + cls + '">' + text + '</span>'; }

/* 数据字典 */
const APPT_STATUS = { 0: ['已提交', 'info'], 1: ['已确认', 'ok'], 2: ['已到诊', 'info'], 3: ['诊疗中', 'warn'], 4: ['已完成', 'off'], 5: ['已取消', 'bad'], 6: ['爽约', 'bad'] };
const BILL_STATUS = { 0: ['待支付', 'warn'], 1: ['已支付', 'ok'], 2: ['已开票', 'info'], 3: ['部分退款', 'off'], 4: ['全额退款', 'bad'] };
const CHAIR_STATUS = { 1: ['在用', 'ok'], 2: ['维修', 'warn'], 3: ['报废', 'bad'] };
const AUDIT_STATUS = { 0: ['待初审', 'warn'], 1: ['初审通过', 'info'], 2: ['终审通过', 'ok'], 3: ['已驳回', 'bad'] };
const DAY_TYPE = { 1: ['正常营业', 'ok'], 2: ['节假日', 'info'], 3: ['休息', 'off'] };

function st(map, v) {
  const d = map[v] || ['未知', 'off'];
  return tag(d[0], d[1]);
}

/* 表格渲染 */
function table(cols, rows, emptyText) {
  if (!rows || !rows.length) return '<div class="empty">' + (emptyText || '暂无数据') + '</div>';
  let h = '<div class="tw"><table><thead><tr>';
  cols.forEach(c => h += '<th' + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + c.t + '</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    h += '<tr>';
    cols.forEach(c => h += '<td>' + c.r(r) + '</td>');
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

/* 弹窗表单 */
function modal(title, fields, onOk) {
  const mask = document.getElementById('mask');
  document.getElementById('dlgTitle').textContent = title;
  let h = '';
  fields.forEach((f, i) => {
    const id = 'f_' + i;
    f._id = id;
    if (f.type === 'row') {
      h += '<div class="frow">';
      f.fields.forEach(sub => {
        const sid = 'f_' + i + '_' + Math.random().toString(36).slice(2, 6);
        sub._id = sid;
        h += '<div class="fld"><label>' + sub.label + '</label>' + control(sub) + '</div>';
      });
      h += '</div>';
    } else {
      h += '<div class="fld"><label>' + f.label + '</label>' + control(f) + '</div>';
    }
  });
  if (fields.some(f => f.note)) h += '<div class="hintline">' + fields.filter(f => f.note).map(f => f.note).join('<br>') + '</div>';
  document.getElementById('dlgBody').innerHTML = h;
  mask.classList.add('on');

  const close = () => { mask.classList.remove('on'); document.getElementById('dlgOk').onclick = null; };
  document.getElementById('dlgX').onclick = close;
  document.getElementById('dlgCancel').onclick = close;
  document.getElementById('dlgOk').onclick = async () => {
    const vals = {};
    let fieldList = [];
    fields.forEach(f => { if (f.type === 'row') fieldList = fieldList.concat(f.fields); else fieldList.push(f); });
    for (const f of fieldList) {
      const el = document.getElementById(f._id);
      vals[f.key] = f.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim();
      if (f.required && (vals[f.key] === '' || vals[f.key] === null)) { toast(f.label + ' 不能为空', false); el.focus(); return; }
    }
    try {
      await onOk(vals);
      close();
    } catch (e) { toast(e.message, false); }
  };
}

function control(f) {
  if (f.type === 'select') {
    return '<select id="' + f._id + '">' + f.options.map(o =>
      '<option value="' + o.v + '"' + (String(f.value) === String(o.v) ? ' selected' : '') + '>' + o.t + '</option>').join('') + '</select>';
  }
  if (f.type === 'textarea') return '<textarea id="' + f._id + '" rows="4">' + esc(f.value || '') + '</textarea>';
  return '<input id="' + f._id + '" type="' + (f.type || 'text') + '" value="' + esc(f.value === undefined || f.value === null ? '' : f.value) + '"' +
    (f.placeholder ? ' placeholder="' + f.placeholder + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') + '>';
}

/* 分页（大列表按 20 条/页，避免几千条一次性渲染卡顿） */
const PAGE = { size: 20, cur: {} };
window.__rerender = window.__rerender || {};
function paged(key, cols, list, emptyText) {
  const max = Math.max(1, Math.ceil(list.length / PAGE.size));
  if (!PAGE.cur[key] || PAGE.cur[key] > max) PAGE.cur[key] = 1;
  const p = PAGE.cur[key];
  const slice = list.slice((p - 1) * PAGE.size, p * PAGE.size);
  let h = table(cols, slice, emptyText || '没有匹配记录');
  h += '<div class="pager">';
  if (list.length > PAGE.size) {
    h += '<button ' + (p <= 1 ? 'disabled' : '') + ' onclick="pageGo(\'' + key + '\',-1)">上一页</button>' +
      '<span>第 ' + p + ' / ' + max + ' 页 · 共 ' + list.length + ' 条</span>' +
      '<button ' + (p >= max ? 'disabled' : '') + ' onclick="pageGo(\'' + key + '\',1)">下一页</button>';
  } else {
    h += '<span>共 ' + list.length + ' 条</span>';
  }
  return h + '</div>';
}
function pageGo(key, d) {
  PAGE.cur[key] = Math.max(1, (PAGE.cur[key] || 1) + d);
  if (window.__rerender && window.__rerender[key]) window.__rerender[key]();
}

    document.getElementById('content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  });
}

  h += '<div class="card"><div class="card-h"><h3>角色说明</h3></div>' + roles.map(r =>
    '<div style="display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid #f2f5f4">' +

    '</div>';
  document.getElementById('content').innerHTML = h;
};

function grant(roleId, permId, el) {
  const on = el.checked;
  api('/admin/role-permissions/grant?roleId=' + roleId + '&permId=' + permId + '&grant=' + on, { method: 'POST' })
    .then(m => toast(m)).catch(e => { el.checked = !on; toast(e.message, false); });

    { key: 'content', label: '正文', type: 'textarea', required: true, placeholder: '面向患者展示的公告内容' }
  ], async v => {
    await api('/notice/publish', { method: 'POST', body: { title: v.title, content: v.content, publisherId: state.me && state.me.user && state.me.user.userId } });
    toast('公告已发布');
    setView('notices');
  });
}
function offlineNotice(id) {
  if (!confirm('确定下架该公告？下架后患者端不再显示。')) return;
  api('/notice/' + id + '/offline', { method: 'POST' })
    .then(() => { toast('已下架'); setView('notices'); }).catch(e => toast(e.message, false));
}

/* ==================== 系统日志（登录留痕 + 增减操作留痕） ==================== */
VIEWS.logs = async () => {
  const [d, op] = await Promise.all([
    api('/admin/login-logs?limit=300'),
    api('/admin/op-logs?limit=300').catch(() => null)
  ]);
  const items = d.items || [];
  const OP_ACTION = { ADD: ['新增', 'ok'], DELETE: ['删除', 'bad'], OFF: ['下架/停用', 'warn'],
    UPDATE: ['变更', 'info'], REFUND: ['退款红冲', 'warn'], CANCEL: ['账户注销', 'bad'] };
  let h = '<div class="stats">' +
    '<div class="stat"><div class="lb">累计进入系统</div><div class="vl">' + d.total + '<small>次</small></div></div>' +
    '<div class="stat"><div class="lb">今日进入</div><div class="vl" style="color:#1a56d6">' + d.todayCount + '<small>次</small></div></div>' +
    '<div class="stat"><div class="lb">失败尝试</div><div class="vl" style="color:#c0453f">' + d.failCount + '<small>次</small></div></div>' +
    (op ? '<div class="stat"><div class="lb">关键操作留痕</div><div class="vl">' + op.total + '<small>条</small></div></div>' : '') +
    '</div>';
  if (op) {
    h += '<div class="card" style="margin-top:16px"><div class="card-h"><h3>增减操作留痕（全部有数可查）</h3>' +
      '<span class="hint">人员/医生/价目/供应商/公告/账单/账户的每一次新增、删除、停用、注销都自动留痕</span>' +
      '<div class="act"><select id="opFilter" style="width:150px"><option value="">全部动作</option>' +
      Object.keys(OP_ACTION).map(k => '<option value="' + k + '">' + OP_ACTION[k][0] + '</option>').join('') +
      '</select><input type="text" id="opSearch" placeholder="搜索对象 / 操作人" style="width:190px"></div></div>' +
      '<div class="stats" style="margin:6px 0 12px">' +
      '<div class="stat"><div class="lb">累计新增</div><div class="vl" style="color:#1a7f4f">' + op.addCount + '<small>笔</small></div></div>' +
      '<div class="stat"><div class="lb">累计删除</div><div class="vl" style="color:#c0453f">' + op.deleteCount + '<small>笔</small></div></div>' +
      '<div class="stat"><div class="lb">账户注销</div><div class="vl">' + op.cancelCount + '<small>笔</small></div></div>' +
      '<div class="stat"><div class="lb">退款红冲</div><div class="vl">' + op.refundCount + '<small>笔</small></div></div>' +
      '</div><div id="opTable"></div></div>';
  }
  h += '<div class="card" style="margin-top:16px"><div class="card-h"><h3>进入记录</h3><span class="hint">最近 ' + items.length + ' 条，按时间倒序；登录成功与失败均留痕</span>' +
    '<div class="act"><select id="lgRole" style="width:130px"><option value="">全部身份</option><option>患者</option><option>牙医</option><option>门店管理员</option><option>总部管理员</option><option value="none">未识别</option></select>' +
    '<select id="lgFilter" style="width:130px"><option value="">全部记录</option><option value="1">仅成功</option><option value="0">仅失败</option></select>' +
    '<input type="text" id="lgSearch" placeholder="搜索账号 / 姓名 / IP" style="width:200px"></div></div><div id="lgTable"></div></div>';
  document.getElementById('content').innerHTML = h;

  if (op) {
    const opItems = op.items || [];
    const renderOp = () => {
      const fa = document.getElementById('opFilter').value;
      const q = (document.getElementById('opSearch').value || '').trim();
      const list = opItems.filter(r => {
        if (fa && r.action !== fa) return false;
        return !q || [r.targetDesc, r.operatorName, r.targetType, r.detail].some(v => String(v || '').includes(q));
      });
      document.getElementById('opTable').innerHTML = paged('oplogs', [
        { t: '操作时间', r: r => '<span class="mono">' + String(r.opTime).replace('T', ' ').slice(0, 19) + '</span>' },
        { t: '动作', r: r => { const a = OP_ACTION[r.action] || [r.action, 'info']; return tag(a[0], a[1]); } },
        { t: '对象', r: r => tag(r.targetType || '-', 'off') + ' <b>' + esc(r.targetDesc || '-') + '</b>' },
        { t: '操作人', r: r => esc(r.operatorName || '-') },
        { t: '详情', r: r => '<span class="mono" style="font-size:12px">' + esc(r.detail || '-') + '</span>' }
      ], list, '暂无操作记录（进行人员/价目/公告等增减操作后自动出现）');
    };
    document.getElementById('opFilter').onchange = () => { PAGE.cur.oplogs = 1; renderOp(); };
    document.getElementById('opSearch').oninput = () => { PAGE.cur.oplogs = 1; renderOp(); };
    renderOp();
  }

  const render = () => {
    const ok = document.getElementById('lgFilter').value;
    const rl = document.getElementById('lgRole').value;
    const q = (document.getElementById('lgSearch').value || '').trim();
    const list = items.filter(r => {
      if (ok !== '' && String(r.success) !== ok) return false;
      if (rl === 'none' && r.roleName) return false;
      if (rl !== '' && rl !== 'none' && r.roleName !== rl) return false;
      return !q || [r.account, r.realName, r.ip].some(v => String(v || '').includes(q));
    });
    document.getElementById('lgTable').innerHTML = paged('logs', [
      { t: '进入时间', r: r => '<span class="mono">' + String(r.loginTime).replace('T', ' ').slice(0, 19) + '</span>' },
      { t: '账号', r: r => '<span class="mono">' + esc(r.account || '-') + '</span>' },
      { t: '姓名', r: r => '<b>' + esc(r.realName || '-') + '</b>' },
      { t: '身份', r: r => (r.roleName ? tag(r.roleName, 'info') : tag('未识别', 'off')) },
      { t: '来源 IP', r: r => '<span class="mono">' + esc(r.ip || '-') + '</span>' },
      { t: '设备', r: r => '<span class="mono" title="' + esc(r.userAgent || '') + '">' + esc((r.userAgent || '-').slice(0, 26)) + '…</span>' },
      { t: '结果', r: r => r.success === 1 ? tag('进入成功', 'ok') : tag('失败：' + (r.failReason || '-'), 'bad') }
    ], list, '暂无登录记录（登录一次后自动出现）');
  };
  window.__rerender.logs = render;
  document.getElementById('lgFilter').onchange = () => { PAGE.cur.logs = 1; render(); };
  document.getElementById('lgRole').onchange = () => { PAGE.cur.logs = 1; render(); };
  document.getElementById('lgSearch').oninput = () => { PAGE.cur.logs = 1; render(); };
  render();
};

/* ==================== 启动 ==================== */
if (location.hash) {
  const v = location.hash.slice(1);
  if (!META[v]) location.hash = 'dashboard';
}
/* 演示模式：admin.html?demo=1 自动以总部管理员登录（仅演示用） */
if (new URLSearchParams(location.search).get('demo') === '1') {
  setTimeout(() => document.getElementById('gBtn').click(), 100);
}
</script>
